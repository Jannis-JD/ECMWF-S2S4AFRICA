name: Daily ECMWF Download

permissions:
  contents: write

on:
  schedule:
    - cron: "16 00 * * *" # every day at 00:16 UTC
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      DATA_BRANCH: main
      WEBSITE_BRANCH: website
      DATA_DIR: website_data
      OUTPUT_DIR: ncdf_data
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
      TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website_branch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements.txt

      # - name: Run download script
      #   continue-on-error: true
      #   working-directory: main_repo
      #   run: |
      #     python download_s2s.py

      # - name: Generate plots
      #   continue-on-error: true
      #   working-directory: main_repo
      #   run: |
      #     python plot_s2s.py
      #   env:
      #     MAIN_PATH: ${{ github.workspace }}/main_repo/
      #     WEBSITE_PATH: ${{ github.workspace }}/website_branch/

      - name: Perform downscaling
        continue-on-error: true
        working-directory: main_repo
        run: |
          python dowscale_dekade.py

      # ── Convert NetCDF → JSON and update catalog ─────────────────
      - name: Convert NetCDF and update catalog
        working-directory: website_branch
        continue-on-error: true
        env:
          NCDF_DIR:       ncdf_data
          OUTPUT_DIR:     data/weekly
          CATALOG_PATH:   data/weekly/catalog.json
          VARIABLES:      "temp,precip,u10,v10,w500,u700,v700,tcw,cape,d2m,mn2t6,mx2t6"
          N_WEEKS:        "6"
          KEEP_FORECASTS: "7"
        run: |
          python website_branch/scripts/nc_to_json_and_catalog.py \
            --ncdf-dir    "${{ env.NCDF_DIR }}" \
            --output-dir  "website_branch/${{ env.OUTPUT_DIR }}" \
            --catalog     "website_branch/${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      # ── Commit main branch ────────────────────────────────────────
      - name: Save generated files to main branch
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Daily automated update"
          git push origin main

      # ── Commit website branch (ncdf data + catalog JSON) ─────────
      - name: Commit website data and catalog
        continue-on-error: true
        run: |
          cd website_branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit on website branch."
          else
            git commit -m "chore: update ncdf data and catalog [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin website
          fi

      - name: Remove website worktree
        run: rm -rf website_branch

      # ── Sheerwater / TAHMO / satellite data ──────────────────────
      - name: Install sheerwater dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements_sheerwater.txt

      - name: Cache nuthatch data
        uses: actions/cache/restore@v4
        with:
          path: main_repo/.nuthatch/caches
          key: nuthatch-

      - name: Download TAHMO data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_tahmo_data.py --country Kenya,Ghana,Senegal,Ethiopia

      - name: Download IMERG satellite data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_sat_data.py --country Kenya,Ghana,Senegal,Ethiopia --satellite imerg

      - name: Download CHIRPS satellite data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_sat_data.py --country Kenya,Ghana,Senegal,Ethiopia --satellite chirps

      - name: Cache nuthatch data
        uses: actions/cache/save@v4
        with:
          path: main_repo/.nuthatch/caches
          key: nuthatch-${{ github.run_id }}

      - name: Generate satellite vs station plots
        working-directory: main_repo
        continue-on-error: true
        run: |
          yes | python plot_sat_vs_stations.py --country Kenya,Ghana,Senegal,Ethiopia

      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_data
          path: |
            main_repo/plots/**/*.png
            main_repo/private_plots/**/*.png
            main_repo/private_data/**/*.csv

  email:
    needs: download
    strategy:
      matrix:
        include:
          - country: Kenya
            emails: >
              josh@rhizaresearch.org,
              genevieve@rhizaresearch.org,
              chriskngetich@gmail.com,
              gacherujemimah@gmail.com,
              mrforecasting@gmail.com,
              koderaphillips@yahoo.com,
              marykilavi@yahoo.com,
              hwkimani1@gmail.com,
              chrisfunk@ucsb.edu,
              alec.jong@gmail.com,
              uiyov@student.kit.edu,
              sshukla@ucsb.edu
          - country: Ghana
            emails: >
              josh@rhizaresearch.org,
              genevieve@rhizaresearch.org,
              C.M.Wainwright@leeds.ac.uk,
              D.J.Parker@leeds.ac.uk,
              alec.jong@gmail.com,
          - country: Senegal
            emails: >
              josh@rhizaresearch.org,
              genevieve@rhizaresearch.org,
              C.M.Wainwright@leeds.ac.uk,
              D.J.Parker@leeds.ac.uk,
              alec.jong@gmail.com,
          - country: Ethiopia
            emails: >
              josh@rhizaresearch.org,
              genevieve@rhizaresearch.org,
              katiekowal@uchicago.edu,
              alec.jong@gmail.com,
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Get ECMWF lagged date
        id: ecmwf_date
        run: echo "::set-output name=date::$(date -d '2 days ago' +'%Y-%m-%d')"

      - name: Download files as artifact
        uses: actions/download-artifact@v4
        with:
          name: s2s_data

      - name: Email out generated plots for ${{ matrix.country }}
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Daily S2S Outlook
          to: ${{ matrix.emails }}
          from: "${{ matrix.country }} Data Share <info@dashboards.rhizaresearch.org>"
          body: >
            Attached are dekadal and weekly outlooks and historical station data related
            to the subseasonal forecast. You can also view the data (except for the station
            data) at ${{ github.server_url }}/${{ github.repository }}.
          reply_to: genevieve@rhizaresearch.org
          attachments: >
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/dekadal/dekadal_precip.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/weekly/weekly_precip.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/weekly/weekly_precip_downscaled_clipped.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/weekly/weekly_medium_range_precip.png,             
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/dekadal/imerg_Kenya_dekadal.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/weekly/imerg_Kenya_weekly.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/dekadal/chirps_Kenya_dekadal.png,
            plots/${{ matrix.country }}/${{ steps.ecmwf_date.outputs.date }}/weekly/chirps_Kenya_weekly.png,
            private_plots/${{ matrix.country }}/${{ steps.date.outputs.date }}/*.png,
            private_data/station_data/${{ matrix.country }}/${{ steps.date.outputs.date }}/*.csv
